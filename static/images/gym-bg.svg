<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="gymGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gymGlow2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="gymGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.15)"/>
    </pattern>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="100%" height="100%" fill="#080B14"/>

  <!-- Energy Glows -->
  <rect width="100%" height="100%" fill="url(#gymGlow1)"/>
  <rect width="100%" height="100%" fill="url(#gymGlow2)"/>
  <rect width="100%" height="100%" fill="url(#gymGrid)"/>

  <!-- Stylized Geometric Gym Lines / Dumbbell Silhouette Accents -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2" fill="none">
    <!-- Barbell / Weight Plate Curves -->
    <circle cx="1600" cy="300" r="240" stroke-dasharray="10 15"/>
    <circle cx="1600" cy="300" r="180"/>
    <circle cx="1600" cy="300" r="60"/>
    
    <circle cx="280" cy="800" r="280" stroke-dasharray="8 12"/>
    <circle cx="280" cy="800" r="200"/>
    <circle cx="280" cy="800" r="70"/>

    <!-- Pulse Wave -->
    <path d="M 0 540 Q 300 480 600 540 T 1200 540 T 1920 540" stroke="#6366F1" stroke-width="3" opacity="0.3"/>
    <path d="M 0 580 Q 400 620 800 580 T 1600 580 T 1920 580" stroke="#10B981" stroke-width="2" opacity="0.25"/>
  </g>
</svg>
